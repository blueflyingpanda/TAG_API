services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - shared

  api:
    build: .
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DB_HOST: tag_api_db_1
      DB_PORT: 5432
      REDIS_HOST: tag_api_redis_1
      REDIS_PORT: 6379
    networks:
      - shared

volumes:
  postgres_data:

networks:
  shared:
    external: true
